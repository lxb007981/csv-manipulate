name: build
on: [ push, pull_request ]
jobs:
  pyinstaller-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'dev'
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Read package.json
        id: package_info
        run: |
          # The jq command below creates two lines of output:
          # name=your-package-name
          # version=1.2.3
          # This is then appended to the GITHUB_OUTPUT file.
          jq -r '"name=\(.name)\nversion=\(.version)"' package.json >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: |
          npm ci
      - name: Build
        run: |
          npm run package
          npm i -g @vscode/vsce
          vsce package
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_info.outputs.name }}-${{ steps.package_info.outputs.version }}.vsix
          path: .
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
            files: ${{ steps.package_info.outputs.name }}-${{ steps.package_info.outputs.version }}.vsix