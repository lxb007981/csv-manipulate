name: build
on: [ push, pull_request ]
jobs:
  pyinstaller-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'dev'
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Read package.json
        id: package_info
        run: |
          # The `jq -r .version package.json` command extracts the version field.
          # The output is then formatted as "key=value" and appended to $GITHUB_OUTPUT.
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
          echo "name=$(jq -r .name package.json)" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: |
          npm ci
      - name: Build
        run: |
          npm run package
          npm i -g @vscode/vsce
          vsce package
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_info.outputs.name }}-${{ steps.package_info.outputs.version }}.vsix
          path: .
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
            files: ${{ steps.package_info.outputs.name }}-${{ steps.package_info.outputs.version }}.vsix